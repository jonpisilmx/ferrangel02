Incluye efectos de **scroll (fade-in / slide-up)** mediante la API de *Intersection Observer* para que los elementos aparezcan suavemente conforme el usuario navega hacia abajo, replicando la interacción dinámica del enlace de referencia.

### Código HTML + CSS + JavaScript

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diseño Mobile First - Personaje Femenino</title>
  <style>
    /* VARIABLES Y PALETA DE COLORES NEUTROS/TIERRA */
    :root {
      --bg-color: #d6d1c7;
      --card-bg: rgba(245, 243, 238, 0.9);
      --text-main: #1f1f1f;
      --text-secondary: #5c5953;
      --accent-color: #3b4235;
      --accent-text: #ffffff;
      --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* CONTENEDOR PRINCIPAL: Estilo mockup móvil en pantallas grandes */
    .mobile-container {
      width: 100%;
      max-width: 430px; /* Tamaño tipo iPhone Pro Max */
      min-height: 880px;
      background-color: #e5e0d8;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* HERO SECTION CON IMAGEN DE FONDO */
    .hero-section {
      position: relative;
      min-height: 580px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      /* Reemplaza la URL por la imagen final del personaje */
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%), 
                  url('http://googleusercontent.com/image_generation_content/0_600') center/cover no-repeat;
    }

    /* ENCABEZADO Y MENÚ */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .brand-logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* CONTENIDO TIPOGRÁFICO SOBRE LA IMAGEN */
    .hero-content {
      margin-top: auto;
      margin-bottom: 20px;
      z-index: 2;
    }

    .hero-title {
      font-size: 2.3rem;
      line-height: 1.1;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 12px;
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: #f0f0f0;
      line-height: 1.4;
      margin-bottom: 20px;
      max-width: 85%;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--accent-color);
      color: var(--accent-text);
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
    }

    /* TARJETA INFERIOR SUPERPUESTA */
    .info-card {
      background-color: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 24px;
      margin: -20px 16px 20px 16px;
      z-index: 3;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .feature-icon {
      font-size: 1.2rem;
    }

    /* SECCIÓN SOCIAL PROOF / TESTIMONIOS */
    .social-proof {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
    }

    .social-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .avatar-group {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin-left: -10px;
      object-fit: cover;
    }

    .avatar:first-child {
      margin-left: 0;
    }

    .badge {
      background-color: #e2ded7;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* SECCIÓN ADICIONAL PARA PROBAR EL EFFECTO DE SCROLL */
    .scroll-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .content-block {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
    }

    /* CLASES DE ANIMACIÓN AL HACER SCROLL (FRAMER STYLE) */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* ADAPTACIÓN PARA ESCRITORIO */
    @media (min-width: 1024px) {
      .mobile-container {
        max-width: 900px;
        min-height: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-radius: 24px;
      }

      .hero-section {
        min-height: 650px;
      }

      .info-card {
        margin: 24px;
        align-self: center;
      }

      .features-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }
  </style>
</head>
<body>

      <div class="social-proof">

        </div>
        <div class="avatar-group">
          <img class="avatar" src="http://googleusercontent.com/image_generation_content/1_582" alt="Avatar 1">
          <img class="avatar" src="http://googleusercontent.com/image_generation_content/2_588" alt="Avatar 2">
