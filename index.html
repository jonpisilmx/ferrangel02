<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fernanda Rangel | Conciencia Financiera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Paleta Oficial */
      --navy-primary: #111462;     /* Azul Marino Profundo */
      --bg-light: #E4ECEF;         /* Gris Hielo / Azul Claro Base */
      --magenta-accent: #D938AD;   /* Magenta / Rosa Neón */
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-dark: #111462;
      --text-muted: #4B5563;
      --border-color: rgba(203, 216, 222, 0.8);
      --font-main: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-light);
      font-family: var(--font-main);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
      overflow-x: hidden;
    }

    /* CONTENEDOR MÓVIL PRINCIPAL (MOBILE-FIRST) */
    .mobile-container {
      width: 100%;
      max-width: 430px;
      background-color: #FFFFFF;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(17, 20, 98, 0.25);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* HERO SECTION CON PERSONAJE DE FONDO DINÁMICO */
    .hero-section {
      position: relative;
      min-height: 580px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: background-image 0.4s ease-in-out;
    }

    /* HEADER Y NAVEGACIÓN FLOTANTE */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-logo {
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .brand-subtitle {
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--bg-light);
      text-transform: uppercase;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #FFFFFF;
      font-size: 1.2rem;
    }

    /* CONTENIDO HERO */
    .hero-content {
      margin-top: auto;
      margin-bottom: 20px;
      z-index: 2;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .hero-title {
      font-size: 2.1rem;
      line-height: 1.15;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .hero-title span {
      color: var(--magenta-accent);
    }

    .hero-subtitle {
      font-size: 0.88rem;
      color: #E4ECEF;
      line-height: 1.45;
      margin-bottom: 20px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--magenta-accent);
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(217, 56, 173, 0.4);
      transition: transform 0.2s ease;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* TARJETA FLOTANTE (GLASSMORPHISM) */
    .info-card {
      background-color: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 20px;
      margin: -24px 16px 20px 16px;
      z-index: 3;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(17,20,98,0.08);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--navy-primary);
    }

    .feature-icon {
      font-size: 1.2rem;
    }

    .social-proof {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
    }

    .social-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--navy-primary);
    }

    .avatar-group {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      margin-left: -8px;
      object-fit: cover;
    }

    .avatar:first-child {
      margin-left: 0;
    }

    .badge {
      background-color: var(--bg-light);
      color: var(--magenta-accent);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    /* CONTENIDO GENERAL */
    .scroll-section {
      padding: 12px 16px 32px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .content-block {
      background-color: var(--card-bg);
      padding: 22px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(17, 20, 98, 0.03);
    }

    .content-block h3 {
      font-size: 1.2rem;
      color: var(--navy-primary);
      margin-bottom: 10px;
    }

    .content-block p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* EMPRENDEDORES & CREADORES */
    .entrepreneur-card {
      background: var(--navy-primary);
      color: #FFFFFF;
      border-radius: 24px;
      padding: 45px 18px 24px 18px;
      position: relative;
      margin-top: 35px;
      box-shadow: 0 10px 25px rgba(17, 20, 98, 0.15);
    }

    .entrepreneur-avatar-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--magenta-accent);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    .entrepreneur-badge {
      display: inline-block;
      background: var(--magenta-accent);
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.65rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
      width: 100%;
    }

    .entrepreneur-card h3 {
      font-size: 1.15rem;
      color: #FFFFFF;
      margin-bottom: 10px;
      text-align: center;
    }

    .entrepreneur-card p {
      font-size: 0.85rem;
      color: #CBD8DE;
      margin-bottom: 18px;
    }

    .kit-feature-card {
      background: rgba(255, 255, 255, 0.08);
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 12px;
    }

    .kit-feature-card h4 {
      font-size: 0.95rem;
      color: var(--magenta-accent);
      margin-bottom: 4px;
    }

    .kit-feature-card p {
      font-size: 0.8rem;
      color: #E4ECEF;
      margin-bottom: 0;
    }

    /* CALCULADORA DE RETIRO */
    .calculator-container {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px 18px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--navy-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #FFFFFF;
      font-family: var(--font-main);
      font-size: 0.9rem;
      color: var(--navy-primary);
      outline: none;
    }

    .radio-group {
      display: flex;
      gap: 8px;
    }

    .radio-option {
      flex: 1;
    }

    .radio-option input {
      display: none;
    }

    .radio-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 4px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      color: var(--navy-primary);
      font-size: 0.8rem;
    }

    .radio-option input:checked + label {
      background: var(--navy-primary);
      border-color: var(--navy-primary);
      color: #FFFFFF;
      font-weight: 600;
    }

    .calc-result-box {
      background: rgba(228, 236, 239, 0.8);
      border-radius: 14px;
      padding: 18px 14px;
      border: 1px solid var(--border-color);
      text-align: center;
      margin-top: 10px;
    }

    .result-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--navy-primary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .result-amount {
      font-size: 1.8rem;
      color: var(--magenta-accent);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* TESTIMONIOS GRID */
    .screenshots-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 12px;
    }

    .screenshot-card {
      background: #FFFFFF;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .screenshot-img-wrapper {
      width: 100%;
      height: 180px;
    }

    .screenshot-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .screenshot-caption {
      padding: 10px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--navy-primary);
      border-top: 1px solid var(--border-color);
      font-weight: 500;
    }

    /* ACERCA DE FER */
    .about-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
    }

    .about-photo-wrapper img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--magenta-accent);
      box-shadow: 0 6px 16px rgba(17, 20, 98, 0.12);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      color: var(--navy-primary);
      font-size: 0.75rem;
      border-top: 1px solid var(--border-color);
      background: rgba(228, 236, 239, 0.9);
      font-weight: 500;
    }

    /* MODAL CONTACTO */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(17, 20, 98, 0.75);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #FFFFFF;
      padding: 24px 20px;
      border-radius: 20px;
      max-width: 380px;
      width: 100%;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 12px;
      right: 12px;
